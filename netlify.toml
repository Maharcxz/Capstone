# Netlify configuration for Vite multi-page static site

[build]
command = "npm run build"
publish = "dist"

# Optional: local dev via Netlify CLI (not required for CI builds)
[dev]
command = "npm run dev"

# Minimal security/feature headers. Camera permission policy helps WebXR/camera features.
[[headers]]
for = "/*"
  [headers.values]
  Permissions-Policy = "camera=(self)"
  Referrer-Policy = "strict-origin-when-cross-origin"

# Clean-URL redirects for multi-page HTML entries
[[redirects]]
from = "/"
to = "/index.html"
status = 200

[[redirects]]
from = "/index"
to = "/index.html"
status = 200

[[redirects]]
from = "/about"
to = "/about.html"
status = 200

[[redirects]]
from = "/contact"
to = "/contact.html"
status = 200

[[redirects]]
from = "/admin-dashboard"
to = "/admin-dashboard.html"
status = 200

[[redirects]]
from = "/preorders"
to = "/preorders.html"
status = 200

[[redirects]]
from = "/preorder"
to = "/preorder.html"
status = 200

[[redirects]]
from = "/preorder-confirmation"
