    <script>
      document.addEventListener("DOMContentLoaded", function() {
	const list = ["glasses1", "glasses2"];
	const visibles = [true, false];
	const setVisible = (button, entities, visible) => {
	  if (button) {
	    if (visible) {
	      button.classList.add("selected");
	    } else {
	      button.classList.remove("selected");
	    }
	  }
	  entities.forEach((entity) => {
	    if (entity) {
	      entity.setAttribute("visible", visible);
	    }
	  });
	}
	list.forEach((item, index) => {
	  const button = document.querySelector("#" + item);
	  const entities = document.querySelectorAll("." + item + "-entity");
	  if (button && entities.length > 0) {
	    setVisible(button, entities, visibles[index]);
	    button.addEventListener('click', () => {
	      visibles[index] = !visibles[index];
	      setVisible(button, entities, visibles[index]);
	    });
	  }
	});
      })
    </script>

<body>
    <div class="virtual-try-on-container">
        <header class="try-on-header">
              <h1 class="try-on-title" onclick="navigateToHome()">Virtual Try-On</h1>
              <a href="index.html" class="back-button-header">↩ Back to Products</a>
          </header>
        
        <main class="try-on-main">
            <div class="camera-container">
                <!-- Loading overlay -->
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                    <p>Initializing AR Camera...</p>
                </div>

                <!-- Glasses selection dropdown -->
                <div class="dropdown-container">
                    <button class="dropdown-btn" onclick="toggleDropdown()">
        <span id="selected-glasses">Select Glasses</span>
                        <span class="dropdown-arrow">▾</span>
                    </button>
                    <div id="glassesDropdown" class="dropdown-menu">
                        <!-- Products will be loaded here dynamically -->
                    </div>
                </div>
                
                <!-- AR Scene container - will be populated after camera is ready -->
                <div id="ar-scene-container" style="position: absolute; inset: 0; width: 100%; height: 100%;"></div>
                 
                 <!-- Controls Panel Removed -->
         </div>
         </main>
         
         <!-- Status message -->
         <div class="status-message" id="statusMessage"></div>
     </div>
     
     <script>
         // Camera and scene initialization
         document.addEventListener('DOMContentLoaded', function() {
             const loadingOverlay = document.getElementById('loadingOverlay');
             const statusMessage = document.getElementById('statusMessage');
             const arSceneContainer = document.getElementById('ar-scene-container');
             
             // Show loading overlay initially
             if (loadingOverlay) loadingOverlay.style.display = 'flex';
             
             // Function to create and initialize the AR scene
             function initializeARScene() {
                 // Create the a-scene element
                 const sceneEl = document.createElement('a-scene');
                 sceneEl.setAttribute('mindar-face', '');
                 sceneEl.setAttribute('embedded', '');
                 sceneEl.setAttribute('color-space', 'sRGB');
                 sceneEl.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights');
                 sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
                 sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');
                 sceneEl.style.position = 'absolute';
                 sceneEl.style.inset = '0';
                 sceneEl.style.width = '100%';
                 sceneEl.style.height = '100%';
                 
                 // Create assets
                 const assetsEl = document.createElement('a-assets');
                 
                 const glassesModel1 = document.createElement('a-asset-item');
                 glassesModel1.id = 'glassesModel1';
                 glassesModel1.setAttribute('src', 'SampleDropdownAssets/3dglasses.glb');
                 
                 const glassesModel2 = document.createElement('a-asset-item');
                 glassesModel2.id = 'glassesModel2';
                 glassesModel2.setAttribute('src', 'SampleDropdownAssets/glasses1.glb');
                 
                 const headOccluder = document.createElement('a-asset-item');
                 headOccluder.id = 'headOccluder';
                 headOccluder.setAttribute('src', 'Assets/headOccluder.glb');
                 
                 assetsEl.appendChild(glassesModel1);
                 assetsEl.appendChild(glassesModel2);
                 assetsEl.appendChild(headOccluder);
                 sceneEl.appendChild(assetsEl);
                 
                 // Create camera
                 const cameraEl = document.createElement('a-camera');
                 cameraEl.id = 'camera';
                 cameraEl.setAttribute('position', '0 0 0');
                 cameraEl.setAttribute('look-controls', 'enabled: false');
                 cameraEl.setAttribute('wasd-controls', 'enabled: false');
                 cameraEl.setAttribute('cursor', 'rayOrigin: mouse');
                 sceneEl.appendChild(cameraEl);
                 
                 // Create head occluder
                 const occluderEntity = document.createElement('a-entity');
                 occluderEntity.setAttribute('mindar-face-target', 'anchorIndex: 168');
                 
                 const occluderModel = document.createElement('a-gltf-model');
                 occluderModel.setAttribute('mindar-face-occluder', '');
                 occluderModel.setAttribute('position', '0 -0.3 0.15');
                 occluderModel.setAttribute('rotation', '0 0 0');
                 occluderModel.setAttribute('scale', '0.065 0.065 0.065');
                 occluderModel.setAttribute('src', '#headOccluder');
                 
                 occluderEntity.appendChild(occluderModel);
                 sceneEl.appendChild(occluderEntity);
                 
                 // Create glasses model 1
                 const glasses1Entity = document.createElement('a-entity');
                 glasses1Entity.setAttribute('mindar-face-target', 'anchorIndex: 168');
                 
                 const glasses1Model = document.createElement('a-gltf-model');
                 glasses1Model.setAttribute('rotation', '0 0 0');
                 glasses1Model.setAttribute('position', '0 0 0');
                 glasses1Model.setAttribute('scale', '0.010 0.010 0.010');
                 glasses1Model.setAttribute('src', '#glassesModel1');
                 glasses1Model.setAttribute('class', 'glasses1-entity');
                 glasses1Model.setAttribute('visible', 'true');
                 
                 glasses1Entity.appendChild(glasses1Model);
                 sceneEl.appendChild(glasses1Entity);
                 
                 // Create glasses model 2
                 const glasses2Entity = document.createElement('a-entity');
                 glasses2Entity.setAttribute('mindar-face-target', 'anchorIndex: 168');
                 
                 const glasses2Model = document.createElement('a-gltf-model');
                 glasses2Model.setAttribute('rotation', '0 0 0');
                 glasses2Model.setAttribute('position', '0 0 0');
                 glasses2Model.setAttribute('scale', '0.010 0.010 0.010');
                 glasses2Model.setAttribute('src', '#glassesModel2');
                 glasses2Model.setAttribute('class', 'glasses2-entity');
                 glasses2Model.setAttribute('visible', 'false');
                 
                 glasses2Entity.appendChild(glasses2Model);
                 sceneEl.appendChild(glasses2Entity);
                 
                 // Add event listeners for scene
                 sceneEl.addEventListener('loaded', function() {
                     console.log('A-Frame scene loaded');
                 });
                 
                 sceneEl.addEventListener('arready', function() {
                     console.log('MindAR is ready');
                     if (loadingOverlay) loadingOverlay.style.display = 'none';
                 });
                 
                 // Append the scene to the container
                 arSceneContainer.innerHTML = '';
                 arSceneContainer.appendChild(sceneEl);
             }
             
             // Handle camera permissions first
             if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                 navigator.mediaDevices.getUserMedia({ video: true })
                     .then(function(stream) {
                         // Camera access granted
                         if (statusMessage) statusMessage.textContent = 'Camera access granted';
                         
                         // Clean up the stream to avoid memory leaks
                         const tracks = stream.getTracks();
                         tracks.forEach(track => track.stop());
                         
                         // Now that we have camera permission, initialize the AR scene
                         initializeARScene();
                     })
                     .catch(function(error) {
                         console.error('Camera access error:', error);
                         if (statusMessage) statusMessage.textContent = 'Camera access denied. Please enable camera permissions.';
                         if (loadingOverlay) loadingOverlay.style.display = 'none';
                     });
             } else {
                 console.error('getUserMedia not supported');
                 if (statusMessage) statusMessage.textContent = 'Camera not supported on this device or browser.';
                 if (loadingOverlay) loadingOverlay.style.display = 'none';
             }
         });
         
         // Navigation function
         function navigateToHome() {
             window.location.href = 'index.html';
         }
         
         // Glasses selection functions
         function selectGlasses(model, name) {
             // Update selected glasses display
             document.getElementById('selected-glasses').textContent = name;
             
             // Update selected state
             document.querySelectorAll('.dropdown-item').forEach(item => {
                 item.classList.remove('selected');
             });
             document.querySelector(`[data-model="${model}"]`).classList.add('selected');
             
             // Hide/show glasses models
             const glasses1Entity = document.querySelector('.glasses1-entity');
             const glasses2Entity = document.querySelector('.glasses2-entity');
             
             if (model === 'glasses1') {
                 if (glasses1Entity) glasses1Entity.setAttribute('visible', true);
                 if (glasses2Entity) glasses2Entity.setAttribute('visible', false);
             } else if (model === 'glasses2') {
                 if (glasses1Entity) glasses1Entity.setAttribute('visible', false);
                 if (glasses2Entity) glasses2Entity.setAttribute('visible', true);
             }
             
             // Close dropdown
             document.getElementById('glassesDropdown').classList.remove('show');
             document.querySelector('.dropdown-btn')?.classList.remove('open');
         }
         
         // Toggle dropdown function
         function toggleDropdown() {
             const dropdown = document.getElementById('glassesDropdown');
             const btn = document.querySelector('.dropdown-btn');
             dropdown.classList.toggle('show');
             if (btn) btn.classList.toggle('open', dropdown.classList.contains('show'));
         }
         
         // Close dropdown when clicking outside
         window.addEventListener('click', function(event) {
             const container = document.querySelector('.dropdown-container');
             const dropdown = document.getElementById('glassesDropdown');
             // Only close if the click is outside the entire container (button + menu)
             if (container && !container.contains(event.target)) {
                 if (dropdown && dropdown.classList.contains('show')) {
                     dropdown.classList.remove('show');
                     document.querySelector('.dropdown-btn')?.classList.remove('open');
                 }
             }
         });
         
         // Capture photo function
         function capturePhoto() {
             // Implementation for photo capture
             console.log('Capturing photo...');
         }
         
         // Switch camera function
         function switchCamera() {
             // Implementation for camera switching
             console.log('Switching camera...');
         }
         
         // Status message function
         function showStatus(message, type = 'info') {
             const statusElement = document.getElementById('statusMessage');
             statusElement.textContent = message;
             statusElement.className = `status-message ${type}`;
             statusElement.style.display = 'block';
             
             setTimeout(() => {
                 statusElement.style.display = 'none';
             }, 3000);
         }
         
         // Hide loading overlay when AR is ready and report errors
         document.addEventListener('DOMContentLoaded', function() {
             const loadingOverlay = document.getElementById('loadingOverlay');
             const sceneEl = document.querySelector('a-scene');

             if (sceneEl) {
                 let arStarting = false;
                 let arStarted = false;
                 const startAR = () => {
                     const arSystem = sceneEl.systems && sceneEl.systems['mindar-face-system'];
                     if (!arSystem || typeof arSystem.start !== 'function') return;
                     if (arStarting || arStarted) return;
                     arStarting = true;
                     try { arSystem.start(); } catch (e) { console.warn('arSystem.start failed', e); }
                     arStarting = false;
                 };

                 sceneEl.addEventListener('arReady', () => {
                     arStarted = true;
                     if (loadingOverlay) loadingOverlay.style.display = 'none';
                     showStatus('Camera ready', 'success');
                 });
                 sceneEl.addEventListener('arError', (event) => {
                     arStarted = false;
                     if (loadingOverlay) {
                         loadingOverlay.style.display = 'flex';
                         loadingOverlay.innerHTML = `
                           <div class=\"loading-spinner\"></div>
                           <p>Camera failed to start. Check permissions and HTTPS.</p>
                           <button id=\"reloadCameraBtn\" class=\"dropdown-btn\" style=\"margin-top:12px;\">Reload Camera</button>
                         `;
                     }
                     const errMsg = event?.detail?.error || 'Failed to start camera';
                     showStatus(errMsg, 'error');
                     console.error('MindAR arError:', event);
                     const btn = document.getElementById('reloadCameraBtn');
                     if (btn) btn.addEventListener('click', () => {
                         try {
                             const arSystem = sceneEl.systems && sceneEl.systems['mindar-face-system'];
                             if (arSystem && typeof arSystem.stop === 'function') arSystem.stop();
                             const video = arSystem && arSystem.video;
                             if (video && video.srcObject) {
                                 video.srcObject.getTracks().forEach(t => t.stop());
                                 video.srcObject = null;
                             }
                         } catch (e) {
                             console.warn('reload cleanup error', e);
                         }
                         // Full reload ensures Emscripten Module is reinitialized cleanly
                         location.reload();
                     }, { once: true });
                 });
                 sceneEl.addEventListener('loaded', startAR);
             } else {
                 // Fallback: hide overlay after a short delay to unblock UI
                 setTimeout(() => { if (loadingOverlay) loadingOverlay.style.display = 'none'; }, 2000);
             }
         });

         // Normalize external URLs from common providers to direct links
         function normalizeExternalUrl(url) {
             if (typeof url !== 'string') return url;
             let u = url.trim();
             const ghMatch = u.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/);
             if (ghMatch) {
                 const [, owner, repo, path] = ghMatch;
                 return `https://raw.githubusercontent.com/${owner}/${repo}/${path}`;
             }
             if (u.includes('dropbox.com')) {
                 try {
                     const dbUrl = new URL(u);
                     dbUrl.searchParams.set('dl', '1');
                     return dbUrl.toString();
                 } catch (e) {}
             }
             const gdFileMatch = u.match(/^https?:\/\/drive\.google\.com\/file\/d\/([^\/]+)\/view.*$/);
             if (gdFileMatch) {
                 const id = gdFileMatch[1];
                 return `https://drive.google.com/uc?export=download&id=${id}`;
             }
             const gdUcMatch = u.match(/^https?:\/\/drive\.google\.com\/uc\?id=([^&]+).*$/);
             if (gdUcMatch) {
                 const id = gdUcMatch[1];
                 return `https://drive.google.com/uc?export=download&id=${id}`;
             }
             return u;
         }

         // ===== Dynamic Dropdown: Load products and update on changes =====
         async function loadProductModelById(productId) {
             try {
                 let product = null;
                 if (typeof getProductById === 'function') {
                     product = await getProductById(productId);
                 } else {
                     const snapshot = await firebase.database().ref('products').child(productId).once('value');
                     product = snapshot.val();
                     if (product) product.id = productId;
                 }
                 if (!product || !product.glbFiles || product.glbFiles.length === 0) {
                     showStatus('No 3D model found for product', 'error');
                     return;
                 }
                 const file = product.glbFiles[0];
                 const glbUrl = normalizeExternalUrl(file.url || file.src || '');
                 if (!glbUrl) {
                     showStatus('Invalid GLB URL', 'error');
                     return;
                 }
                 const glasses1Entity = document.querySelector('.glasses1-entity');
                 const glasses2Entity = document.querySelector('.glasses2-entity');
                 if (glasses1Entity) {
                     glasses1Entity.setAttribute('src', glbUrl);
                     glasses1Entity.setAttribute('visible', true);
                 }
                 if (glasses2Entity) {
                     glasses2Entity.setAttribute('visible', false);
                 }
                 // Update dropdown label to reflect the loaded product
                 const name = (product && product.title) ? product.title : 'Selected Product';
                 const labelEl = document.getElementById('selected-glasses');
                 if (labelEl) labelEl.textContent = name;
                 showStatus('Model loaded', 'success');
             } catch (e) {
                 console.error(e);
                 showStatus('Failed to load model', 'error');
             }
         }

         function renderDropdownProducts(products) {
             const dropdown = document.getElementById('glassesDropdown');
             if (!dropdown) return;
             dropdown.innerHTML = '';
             const visibleProducts = (products || []).filter(p => p && p.visible !== false);
             if (visibleProducts.length === 0) {
                 dropdown.innerHTML = '<div class="dropdown-item" style="opacity:0.7;">No products available</div>';
                 return;
             }
             visibleProducts.forEach(product => {
                 const btn = document.createElement('button');
                 btn.className = 'dropdown-item';
                 btn.textContent = product.title || 'Untitled';
                 btn.dataset.productId = product.id;
                 btn.onclick = async () => {
                     const name = product.title || 'Selected Product';
                     document.getElementById('selected-glasses').textContent = name;
                     await loadProductModelById(product.id);
                     document.getElementById('glassesDropdown').classList.remove('show');
                     document.querySelector('.dropdown-btn')?.classList.remove('open');
                 };
                 dropdown.appendChild(btn);
             });
         }

         async function loadProductsToDropdown() {
             try {
                 let products = [];
                 if (typeof getAllProducts === 'function') {
                     products = await getAllProducts();
                 } else {
                     const snapshot = await firebase.database().ref('products').once('value');
                     snapshot.forEach(child => {
                         const p = child.val();
                         p.id = child.key;
                         products.push(p);
                     });
                 }
                 renderDropdownProducts(products);
                 // Live updates
                 if (typeof listenForProductChanges === 'function') {
                     listenForProductChanges((list) => renderDropdownProducts(list));
                 } else {
                     firebase.database().ref('products').on('value', snap => {
                         const list = [];
                         snap.forEach(child => {
                             const p = child.val();
                             p.id = child.key;
                             list.push(p);
                         });
                         renderDropdownProducts(list);
                     });
                 }
             } catch (e) {
                 console.error('Failed to load products for dropdown:', e);
             }
         }

         // Initialize dropdown products after DOM loads
         document.addEventListener('DOMContentLoaded', function() {
             loadProductsToDropdown();
         });

         // Auto-load GLB model based on productId from URL
         document.addEventListener('DOMContentLoaded', async function() {
             const params = new URLSearchParams(window.location.search);
             const productId = params.get('productId');
             if (!productId) return; // No product specified
             try {
                 showStatus('Loading 3D model...', 'info');
                 await loadProductModelById(productId);
             } catch (e) {
                 console.error(e);
                 showStatus('Failed to load model', 'error');
             }
         });
     </script>

      // Ensure dropdown sits below the fixed header on all devices
      function updateHeaderHeightVar() {

        const h = header.offsetHeight;
        document.documentElement.style.setProperty('--header-height', h + 'px');

     <!-- Proactively request camera permission on page load -->
     <script>
     (function() {
       async function requestCameraPermission() {
         const overlay = document.getElementById('loadingOverlay');
         try {
           // Trigger browser permission prompt immediately.
           const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
           // Close the temporary stream so MindAR can take control of the camera.
           stream.getTracks().forEach(t => t.stop());
           if (overlay) overlay.style.display = 'block'; // keep overlay until AR ready
           showStatus('Camera permission granted', 'success');
         } catch (err) {
           // Show explicit UI to ask user for permission with a retry button
           if (overlay) {
             overlay.style.display = 'flex';
             overlay.innerHTML = `
               <div class="loading-spinner"></div>
               <p>Please allow camera access to start.</p>
               <button id="requestPermissionBtn" class="dropdown-btn" style="margin-top:12px;">Enable Camera</button>
             `;
           }
           showStatus('Camera permission required — click Enable Camera', 'warning');
           const btn = document.getElementById('requestPermissionBtn');
           if (btn) {
             btn.addEventListener('click', requestCameraPermission, { once: true });
           }
           console.warn('getUserMedia error:', err);
         }
       }

       document.addEventListener('DOMContentLoaded', function() {
         if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
           requestCameraPermission();
         } else {
           showStatus('Camera API not available in this browser', 'error');
         }
       });
     })();
     </script>
     
     <!-- Ensure camera stream is released on refresh/tab hide to prevent blue screen -->
     <script>
     (function() {
       function stopMindARAndReleaseCamera() {
         const sceneEl = document.querySelector('a-scene');
         if (!sceneEl) return;
         const arSystem = sceneEl.systems && sceneEl.systems['mindar-face-system'];
         try {
           if (arSystem && typeof arSystem.stop === 'function') {
             arSystem.stop();
           }
           const video = arSystem && arSystem.video;
           if (video && video.srcObject) {
             try {
               video.srcObject.getTracks().forEach(t => t.stop());
               video.srcObject = null;
             } catch (e) {
               console.warn('Failed to stop camera tracks', e);
             }
           }
         } catch (e) {
           console.warn('MindAR cleanup error', e);
         }
       }

       // When the page is being hidden or closed, release camera promptly.
       window.addEventListener('beforeunload', stopMindARAndReleaseCamera);
       window.addEventListener('pagehide', stopMindARAndReleaseCamera);
       document.addEventListener('visibilitychange', function() {
         if (document.hidden) {
           stopMindARAndReleaseCamera();
         }
       });
     })();
     </script>
