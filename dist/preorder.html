                <form class="preorder-page-form" id="preorderForm">
                    <div class="form-row">
                        <div class="form-column">
                            <div class="form-field">
                                <label class="field-label">Full Name</label>
                                <div class="name-inputs">
                                    <input type="text" placeholder="First Name" class="name-input" name="firstName" id="firstName" required aria-invalid="false" aria-describedby="firstNameError" autocomplete="given-name">

                                </div>
                                <div class="field-errors">
                                    <span class="input-error" id="firstNameError" role="alert" aria-live="polite"></span>

                                </div>
                            </div>
                            
                            <div class="form-field">
                                <label class="field-label" for="email">Email</label>
                                <input type="email" placeholder="email@gmail.com" class="full-input" name="email" id="email" required aria-invalid="false" aria-describedby="emailError" pattern="^[A-Za-z0-9._%+-]+@gmail\\.com$" title="Enter a valid Gmail address ending with @gmail.com">
                                <span class="input-error" id="emailError" role="alert" aria-live="polite"></span>
                            </div>
                            
                            <div class="form-field">
                                <label class="field-label" for="phone">Phone Number</label>
                                <input type="tel" class="full-input" name="phone" id="phone" required inputmode="numeric" autocomplete="tel" maxlength="13" pattern="^\\+639\\d{9}$" title="Enter a valid PH mobile number starting with +63 followed by 10 digits" aria-invalid="false" aria-describedby="phoneError" value="+63">
                                <span class="input-error" id="phoneError" role="alert" aria-live="polite"></span>
                            </div>
                            
                            <div class="form-field">
                                <label class="field-label">Frame Name</label>
                                <div class="autocomplete-container">
                                    <input type="text" placeholder="Frame Name or Model" class="full-input" name="frameName" id="frameName" autocomplete="off">
                                    <div class="autocomplete-dropdown" id="frameNameDropdown"></div>
                                </div>
                            </div>
                            
                            <div class="form-field">
                                <label class="field-label" for="quantity">Quantity</label>
                                <p class="field-note" id="quantityGuidance">If you want to pre-order more than 5 frames, please include details in the Additional Notes section.</p>
                                <select class="quantity-select" name="quantity" id="quantity" required aria-describedby="quantityError" aria-invalid="false">
                                    <option value="1" selected>1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>

    <script>
        let allFrameNames = [];
        let isDropdownVisible = false;
        let isSubmitting = false;
        
        document.addEventListener('DOMContentLoaded', function() {
            const preorderForm = document.getElementById('preorderForm');
            const phoneInput = document.getElementById('phone');
            const emailInput = document.getElementById('email');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');
            const quantityInput = document.getElementById('quantity');
            const notesInput = document.getElementById('notes');
            const submitBtnGlobal = preorderForm ? preorderForm.querySelector('.submit-btn') : null;

            function setValidity(input, isValid, errorEl, message='') {
                input.classList.remove('input-valid','input-invalid');
                input.setAttribute('aria-invalid', String(!isValid));
                if (isValid) {
                    input.classList.add('input-valid');
                    if (errorEl) errorEl.textContent = '';
                } else {
                    input.classList.add('input-invalid');
                    if (errorEl) errorEl.textContent = message || 'Invalid input';
                }
                updateSubmitState();
            }

            function updateSubmitState() {
                if (!submitBtnGlobal) return;
                const baseValid = isValidName(firstNameInput.value) &&
                                  isValidName(lastNameInput.value) &&
                                  isValidGmail(emailInput.value) &&
                                  isValidPhone(phoneInput.value);
                const qtyVal = quantityInput ? parseInt(quantityInput.value, 10) : 1;
                const notesVal = notesInput ? (notesInput.value || '').trim() : '';
                const quantityOk = isQuantityValid(qtyVal, notesVal);
                submitBtnGlobal.disabled = !(baseValid && quantityOk) || isSubmitting;
            }

            function isValidGmail(val) {
                return /^[A-Za-z0-9._%+-]+@gmail\.com$/.test(val.trim());
            }
            function isValidName(val) {
                return /^[A-Za-z\s\-'.,]+$/.test(val.trim()) && val.trim().length > 0;
            }
            function isValidPhone(val) {
                return /^\+639\d{9}$/.test(val.trim());
            }

            // Pre-order keywords and quantity validation
            const preOrderKeywordsRegex = /\b(pre[\s-]?order|preorder|special order|bulk order|advance order|advanced order)\b/i;
            function hasPreOrderKeyword(notes) {
                return preOrderKeywordsRegex.test((notes || '').toLowerCase());
            }
            function isQuantityValid(qty, notes) {
                if (!Number.isFinite(qty)) qty = parseInt(qty, 10);
                if (Number.isNaN(qty) || qty < 1 || qty > 10) return false;
                if (qty <= 5) return true;
                return hasPreOrderKeyword(notes);
            }

            // Name: block digits and invalid chars, show message
            [firstNameInput, lastNameInput].forEach((inp, idx) => {
                if (!inp) return;
                const errEl = document.getElementById(idx === 0 ? 'firstNameError' : 'lastNameError');
                inp.addEventListener('input', () => {
                    // remove any digits
                    const cleaned = inp.value.replace(/[0-9]/g,'');
                    if (cleaned !== inp.value) {
                        const pos = inp.selectionStart;
                        inp.value = cleaned;
                        try { inp.setSelectionRange(Math.max((pos || 1) - 1, 0), Math.max((pos || 1) - 1, 0)); } catch {}
                    }
                    const valid = isValidName(inp.value);
                    setValidity(inp, valid, errEl, "Only letters, spaces, hyphen(-), apostrophe('), comma, and period are allowed.");
                });
            });

            // Email: real-time Gmail check
            if (emailInput) {
                const emailErr = document.getElementById('emailError');
                emailInput.addEventListener('input', () => {
                    const valid = isValidGmail(emailInput.value);
                    setValidity(emailInput, valid, emailErr, 'Email must end with @gmail.com');
                });
            }

            // Phone: lock +63 prefix and digits-only after, 10 digits, start with 9
            if (phoneInput) {
                const phoneErr = document.getElementById('phoneError');
                const prefix = '+63';

                function enforcePrefix() {
                    if (!phoneInput.value || !phoneInput.value.startsWith(prefix)) {
                        const digits = phoneInput.value.replace(/\D/g,'');
                        phoneInput.value = prefix + digits;
                    }
                }

                phoneInput.addEventListener('focus', () => {
                    if (!phoneInput.value) phoneInput.value = prefix;
                    setTimeout(() => {
                        if ((phoneInput.selectionStart || 0) < prefix.length) {
                            try { phoneInput.setSelectionRange(prefix.length, prefix.length); } catch {}
                        }
                    }, 0);
                });

                phoneInput.addEventListener('keydown', (e) => {
                    const caret = phoneInput.selectionStart || 0;
                    // prevent backspacing or moving into the prefix
                    if ((e.key === 'Backspace' && caret <= prefix.length) ||
                        (e.key === 'ArrowLeft' && caret <= prefix.length)) {
                        e.preventDefault();
                    }
                });

                phoneInput.addEventListener('input', () => {
                    enforcePrefix();
                    // keep only digits after prefix, max 10
                    const tail = phoneInput.value.slice(prefix.length).replace(/\D/g,'').slice(0,10);
                    phoneInput.value = prefix + tail;

                    // Validity: must be +639XXXXXXXXX, 10 digits, start with 9
                    let message = '';
                    let valid = false;
                    if (tail.length === 0) {
                        message = 'Enter 10 digits after +63';
                    } else if (!/^9/.test(tail)) {
                        message = 'Number must start with 9 after +63';
                    } else if (tail.length < 10) {
                        message = `Enter ${10 - tail.length} more digit(s)`;
                    } else {
                        valid = true;
                    }
                    setValidity(phoneInput, valid, phoneErr, message);
                });

                // Initialize state
                enforcePrefix();
                phoneInput.dispatchEvent(new Event('input', { bubbles: true }));
            }

            // Quantity and Notes: enforce policy
            function validateQuantityAndNotes() {
                if (!quantityInput) return;
                const qty = parseInt(quantityInput.value, 10);
                const notesVal = notesInput ? (notesInput.value || '').trim() : '';
                const errEl = document.getElementById('quantityError');
                let msg = '';
                let valid = false;
                if (Number.isNaN(qty) || qty < 1) {
                    msg = 'Please enter a valid quantity.';
                } else if (qty > 5) {
                    msg = 'Maximum order quantity is 5 frames';
                } else {
                    valid = true;
                }
                setValidity(quantityInput, valid, errEl, msg);
            }
            if (quantityInput) {
                quantityInput.addEventListener('change', validateQuantityAndNotes);
                quantityInput.addEventListener('input', validateQuantityAndNotes);
            }
            if (notesInput) {
                notesInput.addEventListener('input', validateQuantityAndNotes);
            }

            // Initialize submit state once
            validateQuantityAndNotes();
            updateSubmitState();
            
            // Load frame names from database
            loadFrameNames();
            
            // Set up auto-suggestion for frame name input
            setupFrameNameAutocomplete();
            
            // Auto-fill frame name if passed via URL parameter
            autoFillFrameName();
            
            if (preorderForm) {
                preorderForm.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    if (isSubmitting) return;
                    isSubmitting = true;

                    const submitBtn = preorderForm.querySelector('.submit-btn');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Submitting...';
                    }
                    
                    // Get form values
                    const firstName = document.getElementById('firstName').value;
                    const lastName = document.getElementById('lastName').value;
                    const email = document.getElementById('email').value;
                    const phone = document.getElementById('phone').value;
                    const frameName = document.getElementById('frameName').value;
                    const quantity = document.getElementById('quantity').value;
                    const prescription = document.getElementById('prescription').value;
                    const notes = document.getElementById('notes').value;
                    
                    // Validate all fields before submit
                    const normalizedPhone = phone.replace(/\D/g, '');
                    const fm = document.getElementById('formMessage');
                    const qtyNum = parseInt(quantity, 10) || 1;
                    const quantityOk = isQuantityValid(qtyNum, notes);
                    const allValid = isValidName(firstName) && isValidName(lastName) && isValidGmail(email) && /^\+639\d{9}$/.test(phone.trim()) && quantityOk;
                    if (!allValid) {
                        if (!quantityOk) {
                            const qErr = document.getElementById('quantityError');
                            const msg = (qtyNum > 5) ? 'Maximum order quantity is 5 frames' : 'Please enter a valid quantity.';
                            setValidity(document.getElementById('quantity'), false, qErr, msg);
                        }
                        if (fm) {
                            fm.textContent = 'Please correct the highlighted fields before submitting.';
                            fm.className = 'form-message error';
                        }
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Submit';
                        }
                        isSubmitting = false;
                        return;
                    }

                    const isSpecialPreOrder = qtyNum === 5 && hasPreOrderKeyword(notes);
                    const orderType = isSpecialPreOrder ? 'pre-order' : 'standard';

                    // Create pre-order object
                    const preOrder = {
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        phone: normalizedPhone,
                        frameName: frameName,
                        productId: (new URLSearchParams(window.location.search)).get('productId') || null,
                        quantity: qtyNum,
                        prescription: prescription,
                        notes: notes,
                        orderType: orderType,
                        specialRequestKeywordsMatched: isSpecialPreOrder,
                        date: new Date().toISOString(),
                        status: 'pending'
                    };
                    
                    // Save to Firebase using centralized service and show messages
                    const formMessage = document.getElementById('formMessage');
                    if (formMessage) {
                        formMessage.textContent = 'Submitting your pre-order...';
                        formMessage.className = 'form-message info';
                    }

                    try {
                        const { key } = await firebaseServices.savePreOrderToFirebase(preOrder);
                        console.log('Pre-order saved successfully with ID:', key);

                        if (formMessage) {
                            formMessage.textContent = 'Pre-order submitted successfully!';
                            formMessage.className = 'form-message success';
                        }

                        // Create a notification entry (stored in notifications collection) and link to this pre-order
                        try {
                            if (typeof addPreOrderNotification === 'function') {
                                const customerName = `${firstName} ${lastName}`.trim();
                                addPreOrderNotification(preOrder.frameName || 'Titanium Slim Frame', customerName, key);
                            }
                        } catch (err) {
                            console.warn('Notification creation failed:', err);
                        }

                        // Decrement product stock based on the pre-ordered quantity
                        try {
                            const qtyNum = parseInt(preOrder.quantity, 10) || 1;
                            if (window.firebaseServices) {
                                if (preOrder.productId && typeof window.firebaseServices.decrementProductStock === 'function') {
                                    window.firebaseServices.decrementProductStock(preOrder.productId, qtyNum)
                                        .then(res => {
                                            console.log('Stock decremented by ID for', preOrder.frameName, '->', res);
                                        })
                                        .catch(err => {
                                            console.warn('Failed to decrement stock by ID:', err);
                                        });
                                } else if (typeof window.firebaseServices.decrementProductStockByTitle === 'function') {
                                    window.firebaseServices.decrementProductStockByTitle(preOrder.frameName, qtyNum)
                                        .then(res => {
                                            console.log('Stock decremented by title for', preOrder.frameName, '->', res);
                                        })
                                        .catch(err => {
                                            console.warn('Failed to decrement stock by title:', err);
                                        });
                                }
                            }
                        } catch (err) {
                            console.warn('Unexpected error while decrementing stock:', err);
                        }

                        // Automated email confirmation for special pre-orders
                        if (orderType === 'pre-order') {
                            try {
                                const emailHtml = `
                                    <div style="font-family:Poppins,Arial,sans-serif; color:#333; line-height:1.6;">
                                        <p>Hi ${preOrder.firstName} ${preOrder.lastName},</p>
                                        <p>We received your <strong>pre-order request</strong> for <strong>${preOrder.frameName || 'selected frame'}</strong> (Quantity: ${preOrder.quantity}).</p>
                                        <p>We will confirm availability and timeline shortly. If you have additional details, simply reply to this email.</p>
                                        ${preOrder.notes ? `<p><strong>Your Notes:</strong> ${preOrder.notes}</p>` : ''}
                                        <p>— Trinity Optimum Vision Center</p>
                                    </div>`;
                                await fetch('/.netlify/functions/send-email', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        to: preOrder.email,
                                        subject: `Pre-Order Request Received: ${preOrder.frameName || 'Your Selection'}`,
                                        html: emailHtml,
                                        text: `Hi ${preOrder.firstName} ${preOrder.lastName},\n\nWe received your pre-order request for ${preOrder.frameName || 'selected frame'} (Quantity: ${preOrder.quantity}). We will confirm availability and timeline shortly.\n\n— Trinity Optimum Vision Center`
                                    })
                                });
                                console.log('Auto pre-order confirmation sent to', preOrder.email);
                            } catch (mailErr) {
                                console.warn('Failed to send auto pre-order email:', mailErr);
                            }
                        }

                        // Reset form
                        document.getElementById('preorderForm').reset();

                        // Redirect to confirmation page after a short delay
                        setTimeout(() => {
                            window.location.href = `preorder-confirmation.html?frameName=${encodeURIComponent(preOrder.frameName)}&quantity=${encodeURIComponent(preOrder.quantity)}&orderType=${encodeURIComponent(orderType)}`;
                        }, 500);
                    } catch (error) {
                        console.error('Error saving pre-order:', error);

                        if (formMessage) {
                            formMessage.textContent = 'Error submitting pre-order. Please try again.';
                            formMessage.className = 'form-message error';
                        }
                    } finally {
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Submit';
                        }
                        isSubmitting = false;
                    }
                });
            }
        });
        
        // Load frame names from database
        async function loadFrameNames() {
            try {
                if (typeof getAllProducts === 'function') {
                    const products = await getAllProducts();
                    allFrameNames = products
                        .filter(product => product.visible && product.title) // Only visible products with titles
                        .map(product => product.title)
                        .sort(); // Sort alphabetically
                } else {
                    console.warn('getAllProducts function not available');
                }
            } catch (error) {
                console.error('Error loading frame names:', error);
            }
        }
        
        // Auto-fill frame name from URL parameter
        function autoFillFrameName() {
            const urlParams = new URLSearchParams(window.location.search);
            const frameName = urlParams.get('frameName');
            
            if (frameName) {
                const frameNameInput = document.getElementById('frameName');
                if (frameNameInput) {
                    frameNameInput.value = decodeURIComponent(frameName);
                    // Trigger input event to update any related functionality
                    frameNameInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }
        }
        
        // Set up autocomplete functionality for frame name input
        function setupFrameNameAutocomplete() {
            const frameNameInput = document.getElementById('frameName');
            const dropdown = document.getElementById('frameNameDropdown');
            
            if (!frameNameInput || !dropdown) return;
            
            // Handle input events
            frameNameInput.addEventListener('input', function() {
                const query = this.value.trim();
                if (query.length > 0) {
                    showSuggestions(query);
                } else {
                    hideSuggestions();
                }
            });
            
            // Handle focus events
            frameNameInput.addEventListener('focus', function() {
                const query = this.value.trim();
                if (query.length > 0) {
                    showSuggestions(query);
                }
            });
            
            // Handle blur events (with delay to allow for clicks)
            frameNameInput.addEventListener('blur', function() {
                setTimeout(() => {
                    hideSuggestions();
                }, 150);
            });
            
            // Handle keyboard navigation
            frameNameInput.addEventListener('keydown', function(e) {
                if (!isDropdownVisible) return;
                
                const suggestions = dropdown.querySelectorAll('.autocomplete-item');
                const activeSuggestion = dropdown.querySelector('.autocomplete-item.active');
                let activeIndex = -1;
                
                if (activeSuggestion) {
                    activeIndex = Array.from(suggestions).indexOf(activeSuggestion);
                }
                
                switch (e.key) {
                    case 'ArrowDown':
                        e.preventDefault();
                        activeIndex = Math.min(activeIndex + 1, suggestions.length - 1);
                        updateActiveSuggestion(suggestions, activeIndex);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        activeIndex = Math.max(activeIndex - 1, -1);
                        updateActiveSuggestion(suggestions, activeIndex);
                        break;
                    case 'Enter':
                        e.preventDefault();
                        if (activeSuggestion) {
                            selectSuggestion(activeSuggestion.textContent);
                        }
                        break;
                    case 'Escape':
                        hideSuggestions();
                        break;
                }
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!frameNameInput.contains(e.target) && !dropdown.contains(e.target)) {
                    hideSuggestions();
                }
            });
        }
        
        // Show suggestions based on query
        function showSuggestions(query) {
            const dropdown = document.getElementById('frameNameDropdown');
            if (!dropdown) return;
            
            const filteredNames = allFrameNames.filter(name => 
                name.toLowerCase().includes(query.toLowerCase())
            );
            
            if (filteredNames.length === 0) {
                hideSuggestions();
                return;
            }
            
            dropdown.innerHTML = filteredNames
                .slice(0, 10) // Limit to 10 suggestions
                .map(name => `
                    <div class="autocomplete-item" onclick="selectSuggestion('${escapeHtml(name)}')">
                        ${highlightMatch(name, query)}
                    </div>
                `).join('');
            
            dropdown.style.display = 'block';
            isDropdownVisible = true;
        }
        
        // Hide suggestions dropdown
        function hideSuggestions() {
            const dropdown = document.getElementById('frameNameDropdown');
            if (dropdown) {
                dropdown.style.display = 'none';
                isDropdownVisible = false;
            }
        }
        
        // Select a suggestion
        function selectSuggestion(frameName) {
            const frameNameInput = document.getElementById('frameName');
            if (frameNameInput) {
                frameNameInput.value = frameName;
                hideSuggestions();
                frameNameInput.focus();
            }
        }
        
        // Update active suggestion for keyboard navigation
        function updateActiveSuggestion(suggestions, activeIndex) {
            suggestions.forEach((item, index) => {
                if (index === activeIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
        
        // Highlight matching text in suggestions
        function highlightMatch(text, query) {
            const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
            return text.replace(regex, '<strong>$1</strong>');
        }
        
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Escape regex special characters
        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        
        // Using centralized firebaseServices.savePreOrderToFirebase; local duplicate removed
    </script>
